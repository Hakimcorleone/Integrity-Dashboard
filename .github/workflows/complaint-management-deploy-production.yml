name: Complaint Management Production

on:
  push:
    branches: [main]
    paths:
      - "complaint-management/**"
      - ".github/workflows/complaint-management-*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: complaint-management-production
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    defaults:
      run:
        working-directory: complaint-management
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: complaint-management/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm lint && pnpm test
      - name: Prepare production bindings
        env:
          TARGET_ENV: production
          D1_DATABASE_ID: ${{ vars.PRODUCTION_D1_DATABASE_ID }}
          ALLOWED_EMAIL_DOMAIN: ${{ vars.ALLOWED_EMAIL_DOMAIN }}
          TURNSTILE_SITE_KEY: ${{ vars.PRODUCTION_TURNSTILE_SITE_KEY }}
        run: node scripts/prepare-wrangler-config.mjs
      - name: Apply production D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm db:migrate:production
      - name: Build client
        run: pnpm exec vite build
      - name: Deploy production Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: complaint-management
          command: deploy --env production
          secrets: |
            TURNSTILE_SECRET_KEY
            CSRF_SECRET
            RATE_LIMIT_SALT
            ACCESS_AUD
            TEAM_DOMAIN
            GRAPH_TENANT_ID
            GRAPH_CLIENT_ID
            GRAPH_CLIENT_SECRET
            GRAPH_SENDER_EMAIL
        env:
          TURNSTILE_SECRET_KEY: ${{ secrets.PRODUCTION_TURNSTILE_SECRET_KEY }}
          CSRF_SECRET: ${{ secrets.PRODUCTION_CSRF_SECRET }}
          RATE_LIMIT_SALT: ${{ secrets.PRODUCTION_RATE_LIMIT_SALT }}
          ACCESS_AUD: ${{ secrets.PRODUCTION_ACCESS_AUD }}
          TEAM_DOMAIN: ${{ vars.TEAM_DOMAIN }}
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
          GRAPH_SENDER_EMAIL: ${{ secrets.GRAPH_SENDER_EMAIL }}
      - name: Verify production health
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          test -n "$DEPLOYMENT_URL"
          curl --fail --retry 5 --retry-delay 3 "$DEPLOYMENT_URL/api/health"
