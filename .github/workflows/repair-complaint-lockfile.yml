name: Repair complaint-management lockfile

on:
  push:
    branches:
      - feat/complaint-management-system
    paths:
      - ".github/workflows/repair-complaint-lockfile.yml"

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: complaint-management
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/complaint-management-system
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Regenerate lockfile
        run: |
          rm -f pnpm-lock.yaml
          pnpm install --lockfile-only
      - name: Commit repaired lockfile
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add complaint-management/pnpm-lock.yaml
          git commit -m "fix: regenerate pnpm lockfile"
          git push origin HEAD:feat/complaint-management-system
